baseURL: "https://www.callio.pe/"
languageCode: "en-gb"
title: "Calliope"

pygmentsCodeFences: true
pygmentsUseClasses: true
pygmentsStyle: github
rssLimit: 10
pagination:
  pagerSize: 5
sectionPagesMenu: shadow

markup:
  goldmark:
    renderer:
      unsafe: true
    parser:
      attribute:
        block: true
        title: true

permalinks:
  news: /news/:year/:month/:title

# Don't build /tags/ and /categories/ pages
disableKinds: ["taxonomy", "term"]

# Ensure that cache expiry allows a nightly rebuild of contributor data
caches:
  getresource:
    dir: :cacheDir/:project
    maxAge: 1h

params:
  description: "Calliope is a free and open-source (Apache 2.0 licensed) tool that makes it easy to build energy system models at scales ranging from urban districts to entire continents."

  mainSections: ["news"]

  # Repositories whose all-contributors credits are shown under Community.
  contributorSources:
    - repo: calliope-project/calliope
      ref: HEAD

outputs:
  home: ["HTML"] # Default includes RSS
  section: ["HTML", "RSS"]

menu:
  main:
    - identifier: why
      name: Why Calliope?
      title: What Calliope is and what it is good at
      url: /#why
      weight: 5
    - identifier: showcase
      name: Showcase
      title: Models and studies built with Calliope
      url: /#showcase
      weight: 10
    - identifier: community
      name: Community
      title: Who uses Calliope and who builds it
      url: /#community
      weight: 25
    - identifier: join
      name: Join
      title: Getting help and contributing
      url: /#join
      weight: 28
    - identifier: docs
      name: Docs
      title: Calliope documentation
      url: https://calliope.readthedocs.io/en/latest/
      weight: 30
    - identifier: chat
      name: Chat
      title: Community chat on Zulip
      url: https://calliope-modelblocks.zulipchat.com/
      weight: 40
    - identifier: github
      name: GitHub
      title: Calliope source code and issue tracker
      url: https://github.com/calliope-project/calliope
      weight: 50
