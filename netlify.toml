[build]
    publish = "public"
    command = "hugo --minify"

[[redirects]]
    from = "/research/*"
    to = "/#showcase"
    status = 301

[[redirects]]
    from = "/support/*"
    to = "/#join"
    status = 301

[[redirects]]
    from = "/partners-and-team/*"
    to = "/#partners"
    status = 301

[[redirects]]
    from = "/publications/*"
    to = "/#showcase"
    status = 301

[[redirects]]
    from = "/models/*"
    to = "/#showcase"
    status = 301

[[redirects]]
    from = "/model-gallery/*"
    to = "/#showcase"
    status = 301

[[redirects]]
    from = "/development/*"
    to = "/#join"
    status = 301

[context.production.environment]
    HUGO_VERSION = "0.143.1"
    HUGO_ENV = "production"
    HUGO_ENABLEGITINFO = "true"

[context.deploy-preview]
    command = "hugo --minify --buildFuture -b $DEPLOY_PRIME_URL"

[context.deploy-preview.environment]
    HUGO_VERSION = "0.143.1"

[context.branch-deploy]
    command = "hugo --minify -b $DEPLOY_PRIME_URL"

[context.branch-deploy.environment]
    HUGO_VERSION = "0.143.1"
