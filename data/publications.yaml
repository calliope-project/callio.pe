# The papers behind the `research` entries in data/applications.yaml.
#
# One entry per paper, keyed by DOI. Every `research` application names a DOI
# that must be in here, and its citation is rendered from this file rather than
# retyped on the card — see layouts/partials/citation.html.
#
# Bibliographic fields are taken from OpenAlex so that author names, venues and
# years stay consistent.
#
# Required: doi (or url, for works without one), title, authors, year, venue.
# Optional: venue_detail (overrides venue in the citation), open_access,
# openalex, type.
#
# This is bibliography only. Nothing about how an entry is presented belongs
# here; that is decided in data/applications.yaml.
#
# Checked by layouts/partials/check-data.html as the site builds: an invalid
# entry fails the build.

