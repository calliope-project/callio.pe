- id: europe-v2g
  kind: research
  place: Europe
  institutions: "TU Delft"
  icon: charging-station
  title: What are smart charging and vehicle-to-grid actually worth?
  who: TU Delft
  blurb: >-
    Charging infrastructure and its costs added into a European energy system
    model, with uncontrolled charging, V1G and V2G left to compete. Smart
    charging (V1G only) saves the most, at €19–42 billion a year, while V2G saves
    far less but has the potential to earn around €6.4 billion a year in balancing
    markets. Uniform EU charging targets overstate what some countries need, and
    hold back the benefits in others.
  doi: 10.1038/s41560-026-02107-5

