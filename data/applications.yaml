- id: calliope-africa
  kind: research
  place: Africa
  institutions: "Politecnico di Milano"
  icon: globe-africa
  title: What storage and transmission would Africa need?
  who: Politecnico di Milano
  blurb: >-
    A continent-wide model of the role storage and transmission play in
    integrating renewables across Africa, at a resolution that lets the two
    be traded off against each other.
  doi: 10.1016/j.esd.2025.101760

- id: wales-laep
