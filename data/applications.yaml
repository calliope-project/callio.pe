- id: bangalore-resilience
  kind: research
  place: Bangalore
  institutions: "University of Cambridge"
  icon: city
  title: Do district energy designs survive the conditions they were not designed for?
  who: University of Cambridge
  blurb: >-
    An urban district in Bangalore, tested against demand and grid-availability
    scenarios it had not been optimised against. This is a way of checking whether a
    least-cost design is merely least-cost on paper and fails in reality.
  doi: 10.1016/j.apenergy.2021.116465

