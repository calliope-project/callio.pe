# Example applications: things people decided or published with Calliope.
#
# Fields:
#   id       unique slug
#   kind     research | practice | teaching — shown as a pill, and what gives
#            the card its colour
#   place    where it is about, in a word or two: shown beside the pill. Keep
#            it short, it shares a line with the pill and the info button
#   title    a short framing of what was asked or decided, not the paper title
#   blurb    one or two sentences on what came out of it
#   institutions
#            the short form shown on the card: a few names separated by " · ".
#            Keep it short — the card is a quarter of the page wide
#   who      the full attribution, shown only in the popover
#   doi      research entries only: must match an entry in publications.yaml,
#            so the citation is rendered from there and never retyped
#   links    practice and teaching entries: where to read it
#   icon     a Font Awesome 5 solid icon name, without the `fa-`
#   image    optional: a file in assets/images/applications/, used instead of
#            the icon. None of the entries have one yet; drop a file in and
#            name it here and it will be picked up
#
# Checked by layouts/partials/check-data.html as the site builds: an invalid
# entry fails the build rather than rendering a broken card.

- id: brazil-land-conservation
  kind: research
  place: Brazil
  institutions: "ITA · TU Delft"
  icon: tree
  title: Renewables at scale while protecting conservation areas and promoting reforestation
  who: TU Delft and Instituto Tecnológico de Aeronáutica
  blurb: >-
    Keeping large-scale wind and solar out of priority conservation areas
    raises total system cost by only up to 4%. It also allows re-foresting degraded
    lands, sequestering up to an additional 770 Mt of CO₂ a year.
  doi: 10.1016/j.oneear.2025.101520

- id: australia-hydrogen
  kind: practice
  place: Australia
  institutions: "Arup · Frontier Economics · DCCEEW"
  icon: gas-pump
  title: Australia's first national hydrogen infrastructure assessment
  who: Arup with Frontier Economics, for the Department of Climate Change, Energy, the Environment and Water
  blurb: >-
    Where hydrogen infrastructure investment would do most good, across three
    demand scenarios and eight sectors, taking in electricity, gas and water
    networks, refuelling, ports and rail.
  links:
    - {
        label: Final report,
        url: "https://www.dcceew.gov.au/sites/default/files/documents/national-hydrogen-infrastructure-assessment-final-report.pdf",
      }
    - {
        label: Arup on the project,
        url: "https://www.arup.com/en-us/projects/national-hydrogen-infrastructure-assessment-australia/",
      }

- id: europe-diversity
  kind: research
  place: Europe
  institutions: "ETH Zürich · TU Delft"
  icon: project-diagram
  title: How many different ways can Europe reach carbon neutrality?
  who: ETH Zürich and TU Delft
  blurb: >-
    Rather than one cost-optimal answer, this study mapped the space of very
    different system designs that all eliminate fossil fuels across power,
    heat, transport and industry. The results show how much design freedom is left.
  doi: 10.1016/j.joule.2022.05.009

- id: delft-heat-transition
  kind: teaching
  place: Delft
  institutions: "Leiden University · TU Delft"
  icon: fire
  title: Which heat transition for a Delft neighbourhood?
  who: >-
    Leiden University and TU Delft — Alex Nedelcu, Elvire Landais,
    Daan van Amelsfort and Zhi-Chin Ju
  blurb: >-
    District heating, full electrification or a hybrid, sized for four Delft
    neighbourhoods across cold, normal and warm years. The model returns a bill
    of materials for the network, which a life-cycle assessment then turns into
    the environmental cost of actually building each option.
  links:
    - { label: Code, url: "https://github.com/anedelcu2002/SC-G5" }
    - {
        label: Report (PDF,
        75 MB),
        url: "https://github.com/anedelcu2002/SC-G5/blob/main/Environmental%20Impacts%20of%20Infrastructure%20for%20the%20Delft%20Heat%20Transition.pdf",
      }

